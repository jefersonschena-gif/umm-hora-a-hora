:root{--orange:#ff9800;--green:#4caf50;--red:#f44336;--ink:#f2f2f2;--lb:0px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.lb{position:fixed;left:0;right:0;height:var(--lb);background:#000;z-index:3;pointer-events:none}
.lb.top{top:0}.lb.bot{bottom:0}
.hud{position:fixed;inset:0;z-index:4;pointer-events:none;font-family:"Anton",Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.hud .tl,.hud .tr,.hud .bl,.hud .br{position:absolute;font-size:clamp(10px,1.05vw,15px);opacity:0}
.hud .tl{top:calc(var(--lb) + 18px);left:24px}
.hud .tr{top:calc(var(--lb) + 18px);right:24px;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.hud .tr i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
.hud .bl{bottom:calc(var(--lb) + 18px);left:24px;font-size:clamp(14px,1.9vw,26px);display:flex;gap:.6em;align-items:baseline}
.hud .bl .n{color:var(--orange)}
.hud .bl .w{display:inline-flex;overflow:hidden}
.hud .bl .w span{display:inline-block;will-change:transform}
.hud .br{bottom:calc(var(--lb) + 26px);right:24px;width:clamp(80px,14vw,200px);height:2px;background:rgba(255,255,255,.18)}
.hud .br b{position:absolute;left:0;top:0;bottom:0;background:var(--orange);width:0}
.hud .tl s{text-decoration:none;color:var(--orange)}
.ui{position:fixed;z-index:6;right:20px;top:calc(var(--lb) + 46px);display:flex;gap:8px;opacity:.0;transition:opacity .3s}
body:hover .ui,.ui:focus-within,.ui.show{opacity:1}
.ui button{font:600 12px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(20,20,20,.72);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.ui button:hover{border-color:var(--orange)}
.scrub{position:fixed;z-index:6;left:0;right:0;bottom:var(--lb);height:18px;cursor:pointer}
.end{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center}
.end button{font:400 clamp(16px,2vw,22px)/1 "Anton",Impact,sans-serif;letter-spacing:.14em;color:#fff;background:none;border:1px solid rgba(255,255,255,.35);padding:16px 30px;border-radius:999px;cursor:pointer}
.end button:hover{border-color:var(--orange);color:var(--orange)}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;font-size:15px;line-height:1.5;color:#bbb}
body.render .ui,body.render .scrub,body.render .end{display:none!important}
</style>
</head>

/* ---------- utilidades de tempo / easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
// mola amortecida: s = segundos desde o disparo
const spring = (s, k = 7, w = 13) => s <= 0 ? 0 : 1 - Math.exp(-k * s) * Math.cos(w * s);
// janela de impulso (0→1→0)
const pulse = (t, at, attack, decay) => t < at - attack ? 0 : t < at ? eInOutSine(range(t, at - attack, at)) : Math.exp(-(t - at) / decay);
// ruído suave determinístico (soma de senos incomensuráveis)
const noise = (t, s = 0) => Math.sin(t * 1.31 + s) * .5 + Math.sin(t * 2.73 + s * 1.7 + 1.2) * .3 + Math.sin(t * 5.17 + s * 2.3 + .4) * .2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Hermite com tangentes Catmull-Rom não-uniformes: velocidade contínua
   entre keyframes (câmera fluida, sem "parar" em cada chave). */
function hermite(keys, field, t) {
  const n = keys.length;
  if (t <= keys[0].t) return keys[0][field].slice();
  if (t >= keys[n - 1].t) return keys[n - 1][field].slice();
  let i = 0; while (t > keys[i + 1].t) i++;
  const k0 = keys[i], k1 = keys[i + 1], h = k1.t - k0.t, s = (t - k0.t) / h;
  const tan = j => {
    if (keys[j].v && field === 'p') return keys[j].v;
    if (j === 0 || j === n - 1) return keys[j][field].map(() => 0);
    const a = keys[j - 1], b = keys[j + 1];
    return a[field].map((v, d) => (b[field][d] - v) / (b.t - a.t));
  };
  const m0 = tan(i), m1 = tan(i + 1), s2 = s * s, s3 = s2 * s;
  const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;
  return k0[field].map((v, d) => h00 * v + h10 * h * m0[d] + h01 * k1[field][d] + h11 * h * m1[d]);
}

const CAP = (() => { const g = new TextGeometry('H', { font, size: 1, height: .01, curveSegments: 2 }); g.computeBoundingBox(); const h = g.boundingBox.max.y; g.dispose(); return h; })(); // altura das maiúsculas (em)
const glyphCache = new Map();
function glyph(ch, size, depth, bevel) {
  const k = ch + '|' + size + '|' + depth + '|' + bevel;
  if (glyphCache.has(k)) return glyphCache.get(k);
  const g = new TextGeometry(ch, { font, size, height: depth, curveSegments: 7, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * .55, bevelSegments: 3 });
  g.computeBoundingBox();
  const bb = g.boundingBox, cx = (bb.min.x + bb.max.x) / 2;
  g.translate(-cx, -size * CAP / 2, -depth / 2);
  const gd = font.data.glyphs[ch];
  const out = { geo: g, cx, adv: (gd ? gd.ha : RES * .3) / RES * size };
  glyphCache.set(k, out);
  return out;
}
function mats({ front = C.white, frontI = .9, side = 0x15151a, sideEmissive = 0x000000, sideI = 0, chrome = false } = {}) {
  const f = chrome
    ? new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: .16, envMapIntensity: 1.6, clearcoat: 1, clearcoatRoughness: .1 })
    : new THREE.MeshStandardMaterial({ color: front, emissive: front, emissiveIntensity: frontI, roughness: .45, metalness: .1, envMapIntensity: .4 });
  const s = new THREE.MeshStandardMaterial({ color: side, emissive: sideEmissive, emissiveIntensity: sideI, roughness: .3, metalness: .9, envMapIntensity: .8 });
  return [f, s];
}
/* Palavra com letras independentes (para animar letra a letra). */
function word(str, { size = 3, depth = .8, bevel = .06, m = mats(), tracking = 0 } = {}) {
  const group = new THREE.Group();
  const letters = [];
  for (const ch of str) {
    if (ch === ' ') { letters.push({ space: true, adv: font.data.glyphs[' '].ha / RES * size }); continue; }
    const gl = glyph(ch, size, depth, bevel);
    const mesh = new THREE.Mesh(gl.geo, m);
    group.add(mesh);
    letters.push({ mesh, cx: gl.cx, adv: gl.adv, base: new THREE.Vector3() });
  }
  const w = { group, letters, m, size, width: 0 };
  layout(w, tracking);
  w.solid = letters.filter(l => !l.space);
  return w;
}
function layout(w, tracking) {
  let pen = 0;
  for (const l of w.letters) { if (!l.space) l.base.set(pen + l.cx, 0, 0); pen += l.adv + tracking * w.size; }
  pen -= tracking * w.size;
  for (const l of w.letters) if (!l.space) l.base.x -= pen / 2;
  w.width = pen;
}
function setOpacity(m, o) {
  for (const x of m) { x.transparent = o < 1; x.opacity = o; x.depthWrite = o > .5; }

{

function animTunnelWord(w, t, tIn, tPass) {

  w.solid.forEach((l, i) => {
    const a = eOutExpo(range(t, tIn + i * .07, tIn + i * .07 + .7));

    l.mesh.position.copy(_v);
    l.mesh.rotation.set(l.rot.x * (1 - a) + b * l.rot.x * .4, l.rot.y * (1 - a) + b * Math.sign(l.base.x) * 1.4, l.rot.z * (1 - a));

/* =====================================================================
   ÁUDIO — trilha sintetizada, sincronizada com a mesma linha do tempo
   ===================================================================== */
function buildAudio(ctx, out, from) {
  // agenda tudo com t >= from; 'when' = horário do contexto em que t=from
  const when = ctx.currentTime + .05;
  const at = s => when + (s - from);
  const rnd = mulberry32(1234);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const master = ctx.createGain(); master.gain.value = .9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp).connect(out);
  // reverb
  const ir = ctx.createBuffer(2, ctx.sampleRate * 2.6, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const verbIn = ctx.createGain(); verbIn.gain.value = .35; verbIn.connect(verb).connect(master);
  const bus = (g = 1, wet = .3) => { const n = ctx.createGain(); n.gain.value = g; n.connect(master); const s = ctx.createGain(); s.gain.value = wet; n.connect(s).connect(verbIn); return n; };

  const noiseSrc = () => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; return s; };
  const env = (param, s, pts) => { pts.forEach(([dt, v], i) => { const T = at(s + dt); if (T < ctx.currentTime) return; i === 0 ? param.setValueAtTime(v, T) : param.linearRampToValueAtTime(v, T); }); };

  // drone (continuo)
  {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(bus(.5, .4));
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3; lp.connect(g);
    [55, 55.4, 82.5, 110.2].forEach((f, i) => { const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f; o.connect(lp); o.start(at(Math.max(from, 0))); o.stop(at(15.2)); });

/* =====================================================================
   REPRODUÇÃO
   ===================================================================== */
const ui = { play: document.getElementById('bPlay'), sound: document.getElementById('bSound'), restart: document.getElementById('bRestart'), end: document.getElementById('end'), scrub: document.getElementById('scrub') };
let playing = false, tNow = 0, wallStart = 0, soundOn = false, actx = null, audioNode = null;
function startClock(from) {
  tNow = from; wallStart = performance.now() / 1000 - from + (soundOn ? .05 : 0); playing = true;
  ui.end.style.display = 'none'; ui.play.textContent = '❚❚ Pausar';
  stopAudio();
  if (soundOn) { actx.resume(); audioNode = buildAudio(actx, actx.destination, from); }
}
function stopAudio() { if (audioNode) { try { audioNode.disconnect(); } catch (e) {} audioNode = null; } }

function loop() {
  if (playing) {
    tNow = performance.now() / 1000 - wallStart;
    if (tNow >= DURATION) { tNow = DURATION; playing = false; ui.end.style.display = 'flex'; ui.play.textContent = '▶ Continuar'; }

if (RENDER_MODE) {

    const sr = 48000, oc = new OfflineAudioContext(2, sr * DURATION, sr);

  ui.play.onclick = () => playing ? pause() : startClock(tNow >= DURATION ? 0 : tNow);
  ui.restart.onclick = () => startClock(0);
  document.getElementById('bReplay').onclick = () => startClock(0);
  ui.sound.onclick = () => {
    soundOn = !soundOn;
    ui.sound.textContent = soundOn ? '🔊 Som' : '🔇 Som';
    if (soundOn && !actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    startClock(soundOn ? 0 : tNow); // ligar o som reinicia do zero, já sincronizado

}
